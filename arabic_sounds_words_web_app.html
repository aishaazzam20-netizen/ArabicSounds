    // Helper: Safely separate Arabic graphemes (letters + attached diacritics)
    function getArabicGraphemes(str) {
      if (!str) return [];
      const graphemes = [];
      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        if (/[\u064B-\u065F\u0670]/.test(char) && graphemes.length > 0) {
          graphemes[graphemes.length - 1] += char;
        } else {
          graphemes.push(char);
        }
      }
      return graphemes;
    }

    // Convert PCM16 array buffer to WAV Blob
    function pcmToWav(pcmData, sampleRate = 24000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
      const blockAlign = (numChannels * bitsPerSample) / 8;
      const dataSize = pcmData.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeString = (v, offset, str) => {
        for (let i = 0; i < str.length; i++) {
          v.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcmData.length; i++, offset += 2) {
        view.setInt16(offset, pcmData[i], true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Audio Manager
    let currentAudio = null;

    async function playAudioText(text, promptInstruction = "", onStateChange = () => {}) {
      if (!text) return;

      // Immediately terminate active audio to prevent overlap or echo
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      onStateChange(true);
      const trimmed = text.trim();
      const cacheKey = promptInstruction ? `${trimmed}_${promptInstruction}` : trimmed;

      // Check cache first
      if (audioCache[cacheKey]) {
        try {
          const audio = new Audio(audioCache[cacheKey]);
          currentAudio = audio;
          audio.onended = () => { if (currentAudio === audio) currentAudio = null; onStateChange(false); };
          audio.onerror = () => { fallbackGoogleTTS(trimmed, cacheKey, onStateChange); };
          await audio.play();
          return;
        } catch (e) {}
      }

      // Try Gemini 2.5 Flash TTS API
      try {
        const apiKey = ""; // Automatic runtime key insertion
        if (apiKey) {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

          let promptText = "";
          if (promptInstruction) {
            promptText = `You are an expert Arabic teacher speaking Modern Standard Arabic. Do NOT say letter names under any circumstances. ${promptInstruction}. Pronounce with maximum clarity and exact phonetic contrast: "${trimmed}"`;
          } else {
            promptText = `Say clearly in natural Modern Standard Arabic using a clear, warm female teacher voice. Do NOT say letter names. Pronounce ONLY the exact word or short vowel sound: "${trimmed}"`;
          }

          const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: "Sulafat" }
                }
              }
            }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            const result = await response.json();
            const part = result?.candidates?.[0]?.content?.parts?.[0];
            const audioData = part?.inlineData?.data;
            const mimeType = part?.inlineData?.mimeType;

            if (audioData && mimeType && mimeType.startsWith("audio/")) {
              const sampleRateMatch = mimeType.match(/rate=(\d+)/);
              const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
              const pcmBuffer = base64ToArrayBuffer(audioData);
              const pcm16 = new Int16Array(pcmBuffer);
              const wavBlob = pcmToWav(pcm16, sampleRate);
              const audioUrl = URL.createObjectURL(wavBlob);
              
              audioCache[cacheKey] = audioUrl;

              const audio = new Audio(audioUrl);
              currentAudio = audio;
              audio.onended = () => { if (currentAudio === audio) currentAudio = null; onStateChange(false); };
              audio.onerror = () => { fallbackGoogleTTS(trimmed, cacheKey, onStateChange); };
              await audio.play();
              return;
            }
          }
        }
      } catch (err) {
        // Fallback gracefully on API errors
      }

      fallbackGoogleTTS(trimmed, cacheKey, onStateChange);
    }

    async function fallbackGoogleTTS(text, cacheKey, onStateChange) {
      try {
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ar&client=tw-ob`;
        const audio = new Audio(ttsUrl);
        currentAudio = audio;

        audio.onended = () => { if (currentAudio === audio) currentAudio = null; onStateChange(false); };
        audio.onerror = () => { speakWithWebSpeech(text, onStateChange); };

        if (cacheKey) {
          audioCache[cacheKey] = ttsUrl;
        }

        await audio.play();
      } catch (err) {
        speakWithWebSpeech(text, onStateChange);
      }
    }

    function speakWithWebSpeech(text, onStateChange) {
      if (!('speechSynthesis' in window)) {
        onStateChange(false);
        return;
      }
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.8;
      utterance.pitch = 1.1;
      utterance.volume = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const femaleVoice = voices.find(v => v.lang.startsWith('ar') && 
        (v.name.toLowerCase().includes('female') || 
         v.name.toLowerCase().includes('laila') || 
         v.name.toLowerCase().includes('salma') || 
         v.name.toLowerCase().includes('marium'))
      );
      if (femaleVoice) utterance.voice = femaleVoice;

      let ended = false;
      const finish = () => {
        if (!ended) {
          ended = true;
          onStateChange(false);
        }
      };

      utterance.onend = finish;
      utterance.onerror = finish;
      window.speechSynthesis.speak(utterance);

      setTimeout(finish, 1800);
    }

                          <div className="text-xs font-black text-emerald-800 mb-2">الفَتْحَة</div>
                          <div className="text-5xl sm:text-6xl font-black text-slate-900 pt-6 pb-3 my-2 font-quran leading-normal">{currentLetterData.sounds.fatha}</div>
                          <button 
                            onClick={() => playSound(currentLetterData.sounds.fatha, `Pronounce ONLY the short vowel sound '${currentLetterData.sounds.fatha}' clearly without saying letter names.`)}
                            className="btn-tactile w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white border-b-4 border-emerald-800 rounded-xl font-bold flex items-center justify-center gap-2 text-sm shadow-md transition-all"
                          >
                            <Volume2 className="w-4 h-4" /> استمع
                          </button>
                        </div>

                        {/* KASRA */}
                        <div className="bg-teal-50/80 border-2 border-teal-200 rounded-3xl p-4 sm:p-5 text-center shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                          <div className="text-xs font-black text-teal-800 mb-2">الكَسْرَة</div>
                          <div className="text-5xl sm:text-6xl font-black text-slate-900 pt-6 pb-3 my-2 font-quran leading-normal">{currentLetterData.sounds.kasra}</div>
                          <button 
                            onClick={() => playSound(currentLetterData.sounds.kasra, `Pronounce ONLY the short vowel sound '${currentLetterData.sounds.kasra}' clearly without saying letter names.`)}
                            className="btn-tactile w-full py-2.5 bg-gradient-to-r from-teal-600 to-emerald-700 hover:from-teal-500 hover:to-emerald-600 text-white border-b-4 border-teal-900 rounded-xl font-bold flex items-center justify-center gap-2 text-sm shadow-md transition-all"
                          >
                            <Volume2 className="w-4 h-4" /> استمع
                          </button>
                        </div>

                      </div>

                      {/* LISTEN TO ALL 3 VOWELS BUTTON */}
                      <button 
                        onClick={() => playSound(`${currentLetterData.sounds.damma} ... ${currentLetterData.sounds.fatha} ... ${currentLetterData.sounds.kasra}`, `Pronounce the three short vowel sounds in sequence: ${currentLetterData.sounds.damma}, then ${currentLetterData.sounds.fatha}, then ${currentLetterData.sounds.kasra}.`)}
                        className="btn-tactile w-full sm:w-auto px-7 py-3.5 bg-slate-900 hover:bg-slate-800 text-white border-b-4 border-black rounded-2xl text-sm font-extrabold inline-flex items-center justify-center gap-2.5 shadow-lg shadow-slate-900/20 transition-all"
                      >
                        <Volume2 className="w-5 h-5 text-amber-400" /> استمع إلى الأصوات الثلاثة متتابعة
                      </button>
                    </div>

                  </div>
                )}

                {/* PAGES 2, 3, 4: WORD POSITIONS WITH CHINESE TRANSLATION */}
                {pageIndex > 0 && (
                  <div className="text-center py-4 space-y-6 max-w-3xl mx-auto">
                    
                    {/* Position Label Banner */}
                    <div className="inline-block px-6 py-2 bg-gradient-to-r from-emerald-100 to-teal-100 text-emerald-900 border border-emerald-200/80 rounded-full text-sm font-black shadow-sm">
                      {pageIndex === 1 && "مَوْضِعُ الحَرْف: فِي أَوَّلِ الكَلِمَة"}
                      {pageIndex === 2 && "مَوْضِعُ الحَرْف: فِي وَسَطِ الكَلِمَة"}
                      {pageIndex === 3 && "مَوْضِعُ الحَرْف: فِي نِهَايَةِ الكَلِمَة"}
                    </div>

                    {/* Image & Word Container */}
                    <div className="bg-slate-50 border-2 border-slate-200/80 rounded-3xl p-8 shadow-inner flex flex-col items-center justify-center gap-5">
                      
                      {/* Emoji / Illustration Display */}
                      <div className="text-8xl p-6 bg-white rounded-3xl shadow-md border border-slate-100">
                        {currentLetterData.words[pageIndex - 1].image}
                      </div>

                      {/* Display Word with Target Letter Highlighted while preserving Cursive Joining */}
                      <div className="word-huge font-black text-slate-800 tracking-wide font-quran py-1">
                        {getArabicGraphemes(currentLetterData.words[pageIndex - 1].word).map((grapheme, index) => {
                          const isTarget = index === currentLetterData.words[pageIndex - 1].target_index;
                          return (
                            <span 
                              key={index} 
                              className={isTarget 
                                ? "text-rose-600 font-black underline underline-offset-8 decoration-rose-500 decoration-4" 
                                : "text-slate-900 font-black"
                              }
                            >
                              {grapheme}
                            </span>
                          );
                        })}
                      </div>

                      {/* CHINESE TRANSLATION DIRECTLY UNDERNEATH THE WORD */}
                      <div className="px-6 py-2 bg-emerald-100/80 border-2 border-emerald-300 rounded-2xl text-xl sm:text-2xl font-bold font-chinese text-emerald-950 shadow-sm">
                        الترجمة: {currentLetterData.words[pageIndex - 1].translation_zh}
                      </div>

                      {/* TACTILE LISTEN WORD BUTTON */}
                      <button 
                        onClick={() => playSound(currentLetterData.words[pageIndex - 1].word, `Pronounce the Arabic word '${currentLetterData.words[pageIndex - 1].word}' with crystal clear Modern Standard Arabic pronunciation.`)}
                        className="btn-tactile mt-2 px-8 py-4 bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-600 hover:from-emerald-500 hover:to-teal-500 text-white border-b-4 border-emerald-800 rounded-2xl font-extrabold text-lg flex items-center gap-3 shadow-lg shadow-emerald-600/30 transition-all cursor-pointer"
                      >
                        <Volume2 className="w-6 h-6" /> استمع للكلمة
                      </button>

                    </div>

                  </div>
                )}

                {/* BOTTOM NAVIGATION CONTROLS */}
                <div className="flex flex-wrap justify-between items-center gap-4 pt-8 mt-6 border-t border-slate-100">
                  <button 
                    disabled={selectedLetterId === 1 && pageIndex === 0}
                    onClick={handlePrevPage}
                    className="btn-tactile px-6 py-3 bg-slate-100 hover:bg-slate-200 border-2 border-slate-200/80 text-slate-800 font-extrabold rounded-2xl disabled:opacity-40 flex items-center gap-2 transition-all shadow-sm"
                  >
                    <ArrowRight className="w-4 h-4" /> السابق
                  </button>

                  <div className="flex items-center gap-2">
                    {[0, 1, 2, 3].map(idx => (
                      <span 
                        key={idx} 
                        className={`h-3 rounded-full transition-all duration-300 ${pageIndex === idx ? 'bg-emerald-600 w-8 shadow-sm' : 'bg-slate-200 w-3'}`}
                      />
                    ))}
                  </div>

                  <button 
                    onClick={handleNextPage}
                    className="btn-tactile px-7 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white border-b-4 border-emerald-800 font-extrabold rounded-2xl flex items-center gap-2 shadow-md shadow-emerald-600/25 transition-all"
                  >
                    {pageIndex < 3 ? "التالي" : "إكمال الدرس والتالي"} <ArrowLeft className="w-4 h-4" />
                  </button>
                </div>

              </div>
            )}

            {/* TAB: PHONETIC CONTRASTS */}
            {currentTab === 'contrasts' && (
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                <div>
                  <h3 className="text-2xl font-black text-slate-900">التمييز بين الأصوات المتقاربة</h3>
                  <p className="text-sm text-slate-500 font-semibold mt-1">تدريبات الاستماع والمقارنة الدقيقة بين نطق أصوات الحروف المتقاربة</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {SIMILAR_SOUNDS.map((item, idx) => (
                    <div key={idx} className="bg-slate-50/90 border-2 border-slate-200/80 rounded-3xl p-5 space-y-5 shadow-sm hover:shadow-md transition-all">
                      <div className="flex justify-between items-center border-b pb-3">
                        <span className="text-2xl font-black text-emerald-800">{item.pair}</span>
                        
                        {/* Play both sounds in sequence */}
                        <button 
                          onClick={() => playSound(`${item.soundA} ... ${item.soundB}`, `Pronounce first the light sound ${item.soundA}, pause, then pronounce the heavy or contrasting sound ${item.soundB} distinctly.`)}
                          className="btn-tactile px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white border-b-2 border-emerald-800 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-sm"
                        >
                          <Volume2 className="w-4 h-4 text-amber-300" /> استمع للصوتين متتابعين
                        </button>
                      </div>

                      {/* Isolated Short Sound Buttons */}
                      <div className="grid grid-cols-2 gap-3 text-center">
                        <button 
                          onClick={() => playSound(item.soundA, item.promptSoundA || `Pronounce the short sound '${item.soundA}' as a light, non-emphatic, thin Muraqqaq sound in Modern Standard Arabic.`)}
                          className="btn-tactile p-3.5 bg-emerald-50/80 border-2 border-emerald-200 rounded-2xl hover:bg-emerald-100 transition-all shadow-sm flex items-center justify-between px-4"
                        >
                          <span className="text-2xl font-black text-emerald-900 font-quran">{item.soundA}</span>
                          <div className="flex items-center gap-1 text-xs font-bold text-emerald-700">
                            <Volume2 className="w-4 h-4" /> الصوت الأول
                          </div>
                        </button>

                        <button 
                          onClick={() => playSound(item.soundB, item.promptSoundB || `Pronounce the short sound '${item.soundB}' as a heavy, emphatic, deep Mufakhkham sound in Modern Standard Arabic.`)}
                          className="btn-tactile p-3.5 bg-teal-50/80 border-2 border-teal-200 rounded-2xl hover:bg-teal-100 transition-all shadow-sm flex items-center justify-between px-4"
                        >
                          <span className="text-2xl font-black text-teal-900 font-quran">{item.soundB}</span>
                          <div className="flex items-center gap-1 text-xs font-bold text-teal-700">
                            <Volume2 className="w-4 h-4" /> الصوت الثاني
                          </div>
                        </button>
                      </div>

                      {/* Word Examples Side by Side */}
                      <div className="grid grid-cols-2 gap-3 text-center">
                        <button 
                          onClick={() => playSound(item.wordA, item.promptA || `Pronounce the Arabic word '${item.wordA}' with a light, non-emphatic Muraqqaq initial sound in clear Modern Standard Arabic.`)}
                          className="btn-tactile p-3.5 bg-white border-2 border-slate-200/80 rounded-2xl hover:bg-emerald-50 hover:border-emerald-300 transition-all shadow-sm"
                        >
                          <div className="text-xl font-black text-slate-900">{item.wordA}</div>
                          <div className="text-xs text-slate-500 font-bold mt-1">مثال الأول</div>
                        </button>
                        <button 
                          onClick={() => playSound(item.wordB, item.promptB || `Pronounce the Arabic word '${item.wordB}' with a distinct heavy, emphatic Mufakhkham initial sound in clear Modern Standard Arabic.`)}
                          className="btn-tactile p-3.5 bg-white border-2 border-slate-200/80 rounded-2xl hover:bg-emerald-50 hover:border-emerald-300 transition-all shadow-sm"
                        >
                          <div className="text-xl font-black text-slate-900">{item.wordB}</div>
                          <div className="text-xs text-slate-500 font-bold mt-1">مثال الثاني</div>
                        </button>
                      </div>

                      <p className="text-xs font-bold text-slate-600 leading-relaxed bg-white/80 p-3 rounded-xl border border-slate-200/60">{item.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: PRACTICE & QUIZ */}
            {currentTab === 'practice' && (
              <QuizModule playSound={playSound} database={ARABIC_DATABASE} similarSounds={SIMILAR_SOUNDS} />
            )}

          </main>

          {/* FOOTER */}
          <footer className="mt-8 text-center text-xs text-slate-400 py-4 border-t border-slate-200 font-bold">
            <p>العربية من الصوت إلى الكلمة | Arabic Sounds & Words</p>
          </footer>

        </div>
      );
    }

    function generate20Questions(database, similarSounds) {
      const questions = [];

      const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

      // PART 1: General Short Vowel Sounds (5 Questions)
      const shuffledDatabaseForSounds = shuffle(database);
      for (let i = 0; i < 5; i++) {
        const targetLetter = shuffledDatabaseForSounds[i];
        const vowelKeys = ['fatha', 'damma', 'kasra'];
        const randomVowelKey = vowelKeys[Math.floor(Math.random() * vowelKeys.length)];
        const targetSound = targetLetter.sounds[randomVowelKey];

        const distractors = shuffledDatabaseForSounds
          .filter(item => item.id !== targetLetter.id)
          .slice(0, 3)
          .map(item => item.sounds[randomVowelKey]);

        const options = shuffle([targetSound, ...distractors]);

        questions.push({
          id: `sound_${i}_${Date.now()}`,
          type: 'sound',
          sectionTitle: 'الجزء الأول: أصوات الحروف بالحركات (1 - 5)',
          questionText: 'استمع لصوت الحرف بالحركة القليلة ثم اختر الشكل الصحيح:',
          audioText: targetSound,
          promptInstruction: `Pronounce ONLY the short vowel sound '${targetSound}' clearly without saying letter names.`,
          correctAnswer: targetSound,
          options: options
        });
      }

      // PART 2: Similar Sounds / Minimal Pairs Contrast (5 Questions)
      const shuffledPairs = shuffle(similarSounds).slice(0, 5);
      for (let i = 0; i < 5; i++) {
        const pairObj = shuffledPairs[i];
        const isA = Math.random() < 0.5;
        const targetSound = isA ? pairObj.soundA : pairObj.soundB;
        const prompt = isA 
          ? (pairObj.promptSoundA || `Pronounce '${pairObj.soundA}' clearly as a short vowel sound.`)
          : (pairObj.promptSoundB || `Pronounce '${pairObj.soundB}' clearly as a short vowel sound.`);

        // Pick 2 other distractors from database fatha sounds
        const extraDistractors = shuffle(database.map(l => l.sounds.fatha))
          .filter(s => s !== pairObj.soundA && s !== pairObj.soundB)
          .slice(0, 2);

        const options = shuffle([pairObj.soundA, pairObj.soundB, ...extraDistractors]);

        questions.push({
          id: `similar_${i}_${Date.now()}`,
          type: 'similar',
          sectionTitle: 'الجزء الثاني: تمييز الأصوات المتشابهة (6 - 10)',
          questionText: `استمع لصوت الحرف ودقّق بين الأصوات المتقاربة (${pairObj.pair}):`,
          audioText: targetSound,
          promptInstruction: prompt,
          correctAnswer: targetSound,
          options: options
        });
      }

      // PART 3: Spoken Words from Database ONLY (10 Questions)
      const allWordObjects = database.flatMap(item => item.words);
      const shuffledWordObjects = shuffle(allWordObjects).slice(0, 10);
      const allWordStrings = [...new Set(allWordObjects.map(w => w.word))];

      for (let i = 0; i < 10; i++) {
        const targetObj = shuffledWordObjects[i];
        const targetWord = targetObj.word;

        const distractors = shuffle(allWordStrings.filter(w => w !== targetWord)).slice(0, 3);
        const options = shuffle([targetWord, ...distractors]);

        questions.push({
          id: `word_${i}_${Date.now()}`,
          type: 'word',
          sectionTitle: 'الجزء الثالث: الاستماع للكلمات (11 - 20)',
          questionText: 'استمع إلى الكلمة المنطوقة، ثم اختر الكلمة الصحيحة من الخيارات:',
          audioText: targetWord,
          promptInstruction: `Pronounce the Arabic word '${targetWord}' with crystal clear Modern Standard Arabic pronunciation.`,
          correctAnswer: targetWord,
          options: options,
          image: targetObj.image
        });
      }

      return questions;
    }

    function QuizModule({ playSound, database, similarSounds }) {
      const [questionList, setQuestionList] = useState([]);
      const [questionIndex, setQuestionIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [isCorrect, setIsCorrect] = useState(null);
      const [isQuizCompleted, setIsQuizCompleted] = useState(false);

      // Initialize randomized 20-question bank
      const initQuiz = () => {
        const newQuestions = generate20Questions(database, similarSounds);
        setQuestionList(newQuestions);
        setQuestionIndex(0);
        setScore(0);
        setSelectedAnswer(null);
        setIsCorrect(null);
        setIsQuizCompleted(false);
      };

      useEffect(() => {
        initQuiz();
      }, [database, similarSounds]);

      if (questionList.length === 0) {
        return (
          <div className="bg-white rounded-3xl p-10 text-center font-bold text-slate-500">
            جاري تحضير أسئلة الاختبار...
          </div>
        );
      }

      const currentQ = questionList[questionIndex];

      const handleCheck = (option) => {
        if (selectedAnswer !== null) return;
        setSelectedAnswer(option);
        if (option === currentQ.correctAnswer) {
          setIsCorrect(true);
          setScore(prev => prev + 1);
        } else {
          setIsCorrect(false);
        }
      };

      const handleNext = () => {
        setSelectedAnswer(null);
        setIsCorrect(null);
        if (questionIndex + 1 < 20) {
          setQuestionIndex(prev => prev + 1);
        } else {
          setIsQuizCompleted(true);
        }
      };

      // Summary screen when quiz completes
      if (isQuizCompleted) {
        const percent = Math.round((score / 20) * 100);
        return (
          <div className="bg-white rounded-3xl shadow-lg border border-slate-200/80 p-8 max-w-2xl mx-auto text-center space-y-6">
            <div className="w-20 h-20 mx-auto bg-amber-100 rounded-full flex items-center justify-center text-amber-600 shadow-inner">
              <Award className="w-12 h-12" />
            </div>

            <h3 className="text-3xl font-black text-slate-900">نتيجة الاختبار الإجمالية</h3>
            
            <div className="bg-slate-50 border-2 border-slate-200 rounded-3xl p-6 max-w-md mx-auto space-y-2">
              <div className="text-5xl font-black text-emerald-600">{score} / 20</div>
              <div className="text-sm font-bold text-slate-600">النسبة المئوية: {percent}%</div>
              <p className="text-xs font-bold text-emerald-800 pt-2">
                {percent >= 80 ? 'ممتاز جداً! أحسنت صنعاً 👏' : percent >= 50 ? 'جيد جداً! واصل التدريب 🌟' : 'يحتاج للتكرار والمراجعة 💡'}
              </p>
            </div>

            <button 
              onClick={initQuiz}
              className="btn-tactile px-8 py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-lg rounded-2xl shadow-lg shadow-emerald-600/30 border-b-4 border-emerald-800 inline-flex items-center gap-3 transition-all"
            >
              <RotateCcw className="w-6 h-6" /> إعادة الاختبار (20 سؤالاً جديداً)
            </button>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 sm:p-8 max-w-2xl mx-auto space-y-6">
          
          {/* TOP QUIZ PROGRESS BAR */}
          <div className="space-y-3 border-b pb-4">
            <div className="flex justify-between items-center">
              <div>
                <span className="text-xs font-black px-3 py-1 bg-amber-100 text-amber-900 rounded-full border border-amber-200">
                  {currentQ.sectionTitle}
                </span>
              </div>
              <div className="text-sm font-black text-emerald-800 bg-emerald-50 px-3.5 py-1.5 rounded-2xl border border-emerald-200">
                النتيجة: {score} / 20
              </div>
            </div>

            <div className="flex justify-between items-center text-xs font-bold text-slate-500">
              <span>السؤال {questionIndex + 1} من 20</span>
              <span>{Math.round(((questionIndex + 1) / 20) * 100)}%</span>
            </div>

            <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden border border-slate-200">
              <div 
                className="bg-gradient-to-r from-emerald-500 to-teal-500 h-full transition-all duration-300"
                style={{ width: `${((questionIndex + 1) / 20) * 100}%` }}
              />
            </div>
          </div>

          {/* QUESTION PROMPT CARD */}
          <div className="bg-gradient-to-br from-slate-50 to-emerald-50/60 border-2 border-slate-200/80 rounded-3xl p-6 sm:p-8 text-center space-y-4">
            <p className="text-sm font-black text-slate-800">{currentQ.questionText}</p>
            
            {/* Speaker Button */}
            <button 
              onClick={() => playSound(currentQ.audioText, currentQ.promptInstruction)}
              className="btn-tactile p-6 bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-full shadow-lg shadow-emerald-600/30 border-b-4 border-emerald-800 inline-flex items-center justify-center transition-all cursor-pointer"
              title="اضغط للاستماع للصوت"
            >
              <Volume2 className="w-10 h-10" />
            </button>
            <p className="text-xs font-bold text-emerald-800">اضغط على زر السماعة للاستماع</p>
          </div>

          {/* FIXED OPTIONS GRID */}
          <div className={`grid gap-4 ${currentQ.type === 'word' ? 'grid-cols-2' : 'grid-cols-2'}`}>
            {currentQ.options.map((optionText, idx) => {
              const isSelected = selectedAnswer === optionText;
              let btnClass = "bg-slate-50 hover:bg-slate-100 border-slate-200/80 text-slate-900 hover:border-emerald-400";
              
              if (selectedAnswer !== null) {
                if (optionText === currentQ.correctAnswer) {
                  btnClass = "bg-emerald-500 text-white border-emerald-600 shadow-md";
                } else if (isSelected) {
                  btnClass = "bg-rose-500 text-white border-rose-600 shadow-md";
                }
              }

              return (
                <button 
                  key={idx}
                  onClick={() => handleCheck(optionText)}
                  disabled={selectedAnswer !== null}
                  className={`btn-tactile py-5 px-4 font-black rounded-2xl border-2 transition-all shadow-sm ${
                    currentQ.type === 'word' ? 'text-2xl sm:text-3xl font-quran' : 'text-4xl font-quran'
                  } ${btnClass}`}
                >
                  {optionText}
                </button>
              );
            })}
          </div>

          {/* FEEDBACK & NEXT BUTTON */}
          {selectedAnswer !== null && (
            <div className="space-y-4 pt-2">
              <div className={`p-4 rounded-2xl font-black text-sm text-center ${isCorrect ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-rose-100 text-rose-900 border border-rose-200'}`}>
                {isCorrect ? 'إجابة صحيحة! أحسنت 👏' : `إجابة خاطئة! الإجابة الصحيحة هي: (${currentQ.correctAnswer})`}
              </div>
              <button 
                onClick={handleNext}
                className="btn-tactile w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-black border-b-4 border-black rounded-2xl text-base shadow-md transition-all flex items-center justify-center gap-2"
              >
                {questionIndex + 1 < 20 ? "السؤال التالي" : "عرض نتيجة الاختبار النهائية"} <ArrowLeft className="w-5 h-5" />
              </button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
